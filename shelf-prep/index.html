<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2a5d84">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Shelf Prep">
  <title>Shelf Prep</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <nav class="tabs" id="tabs">
      <div class="brand">Shelf Prep</div>
      <button data-action="nav" data-hash="home"><span class="ico">🫀</span><span>Body</span></button>
      <button data-action="nav" data-hash="quiz"><span class="ico">📝</span><span>Questions</span></button>
      <button data-action="nav" data-hash="cards"><span class="ico">🗂️</span><span>Flashcards</span></button>
      <button data-action="nav" data-hash="progress"><span class="ico">📈</span><span>Progress</span></button>
      <button data-action="nav" data-hash="library"><span class="ico">📚</span><span>Library</span></button>
    </nav>
    <main id="app"></main>
  </div>
  <div id="toast" class="toast" role="status" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
