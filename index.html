<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2f6f5e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Home Hub">
  <title>Home Hub</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <nav class="tabs" id="tabs">
      <div class="brand">Home Hub</div>
      <button data-action="nav" data-view="grocery"><span class="ico">🛒</span><span>Groceries</span></button>
      <button data-action="nav" data-view="reminders"><span class="ico">⏰</span><span>Reminders</span></button>
      <button data-action="nav" data-view="notes"><span class="ico">📝</span><span>Notes</span></button>
      <button data-action="nav" data-view="settings"><span class="ico">⚙️</span><span>Settings</span></button>
    </nav>
    <main id="app"></main>
  </div>
  <div id="toast" class="toast" hidden></div>
  <script type="module" src="app.js"></script>
</body>
</html>
