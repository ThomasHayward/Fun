<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fun</title>
  <style>
    :root { --bg: #f6f5f1; --surface: #fff; --text: #1d2321; --muted: #6b7470; --line: #e3e1da; --accent: #2f6f5e; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #131615; --surface: #1c201f; --text: #e9ecea; --muted: #96a09b; --line: #2c3230; --accent: #6cc3a6; }
    }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 640px; margin: 0 auto; padding: 40px 16px; }
    h1 { margin: 0 0 4px; }
    p { color: var(--muted); margin: 0 0 24px; }
    a.app { display: flex; gap: 14px; align-items: center; padding: 14px; margin-bottom: 10px; background: var(--surface);
      border: 1px solid var(--line); border-radius: 14px; color: inherit; text-decoration: none; }
    a.app img { width: 52px; height: 52px; border-radius: 12px; }
    a.app small { display: block; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>Fun</h1>
    <p>Little apps and experiments.</p>
    <!-- Add a link here for each new app folder. -->
    <a class="app" href="home-hub/">
      <img src="home-hub/icons/icon-192.png" alt="">
      <span><strong>Home Hub</strong><small>Notes, reminders and grocery lists sorted by aisle</small></span>
    </a>
  </main>
</body>
</html>
